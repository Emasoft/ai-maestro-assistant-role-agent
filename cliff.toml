# git-cliff configuration for changelog generation
# https://git-cliff.org

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.id %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}\
    {% endfor %}
{% endfor %}
"""
footer = """
---
*Generated by [git-cliff](https://git-cliff.org)*
"""
trim = true
# The CHANGELOG section for a version BECOMES the GitHub release body
# (release.yml feeds it to `gh release create --notes-file`), so anything in it
# is GitHub-rendered prose. A commit subject that mentions `@something` — and
# ours legitimately do, because this project's whole bug was about the `@` — is
# copied verbatim by git-cliff and would linkify in the release note, paging a
# real account. That is the very harm v0.3.3 ships to fix, reintroduced by the
# release notes announcing the fix.
#
# So wrap any word-boundary `@word` in backticks, where GitHub does not notify.
# Applied here rather than by hand-editing CHANGELOG.md because a hand edit is
# undone by the next `git-cliff` run; this survives every future release.
# Word-boundary only: an email local part or a `pkg@1.2.3` / `action@v4` pin is
# glued to a preceding character and must be left alone.
postprocessors = [
  { pattern = '(^|[\s(\[{])@([A-Za-z][A-Za-z0-9-]*)', replace = '${1}`@${2}`' },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/Emasoft/ai-maestro-assistant-role-agent/issues/${2}))" },
  { pattern = '\s+$', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^release", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous Tasks" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
